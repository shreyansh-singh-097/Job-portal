<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f1f3f6;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #1976d2, #42a5f5);
      color: #fff;
      padding: 25px 15px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 8px 0 0; opacity: 0.9; }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search-box {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input, select {
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 12px 18px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #125ea8; }

    .jobs {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .job-card {
      background: #fff;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .job-card:hover { transform: translateY(-4px); }

    .badge {
      align-self: flex-start;
      background: #e3f2fd;
      color: #1565c0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .job-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #1976d2;
    }

    .job-card p {
      margin: 4px 0;
      font-size: 14px;
    }

    .actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .details-btn { background: #6a1b9a; }
    .save-btn { background: #2e7d32; }
    .apply-btn {
      background: #ef6c00;
      text-decoration: none;
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      flex: 1;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      max-height: 90%;
      overflow-y: auto;
    }

    .close {
      float: right;
      font-size: 22px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .search-box { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Job Portal</h1>
  <p>Find • Explore • Save Jobs Easily</p>
</header>

<div class="container">
  <div class="search-box">
    <input type="text" id="search" placeholder="Search job title..." />
    <select id="category">
      <option value="">All Categories</option>
      <option value="Software">Software</option>
      <option value="Design">Design</option>
      <option value="Marketing">Marketing</option>
    </select>
    <button onclick="loadJobs()">Search</button>
  </div>

  <div class="jobs" id="jobs"></div>
</div>

<div class="modal" id="jobModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  const API_URL = "https://remotive.com/api/remote-jobs";

  async function loadJobs() {
    const search = document.getElementById('search').value.toLowerCase();
    const category = document.getElementById('category').value;

    const res = await fetch(API_URL);
    const data = await res.json();
    let jobs = data.jobs;

    if (search) jobs = jobs.filter(j => j.title.toLowerCase().includes(search));
    if (category) jobs = jobs.filter(j => j.category.includes(category));

    displayJobs(jobs.slice(0, 20));
  }

  function displayJobs(jobs) {
    const jobsDiv = document.getElementById('jobs');
    jobsDiv.innerHTML = "";

    jobs.forEach(job => {
      const div = document.createElement('div');
      div.className = 'job-card';
      div.innerHTML = `
        <span class="badge">${job.category}</span>
        <h3>${job.title}</h3>
        <p><b>Company:</b> ${job.company_name}</p>
        <p><b>Location:</b> ${job.candidate_required_location}</p>
        <div class="actions">
          <button class="details-btn" onclick='viewDetails(${JSON.stringify(job)})'>Details</button>
          <button class="save-btn" onclick='saveJob(${JSON.stringify(job)})'>Save</button>
          <a class="apply-btn" href="${job.url}" target="_blank">Apply</a>
        </div>
      `;
      jobsDiv.appendChild(div);
    });
  }

  function viewDetails(job) {
  const tempDiv = document.createElement("div");
  tempDiv.innerHTML = job.description;

  const cleanText = tempDiv.innerText.substring(0, 800);

  document.getElementById('modalBody').innerHTML = `
    <h2>${job.title}</h2>
    <p><b>Company:</b> ${job.company_name}</p>
    <p><b>Category:</b> ${job.category}</p>
    <p><b>Location:</b> ${job.candidate_required_location}</p>
    <hr>
    <p>${cleanText}...</p>
  `;

  document.getElementById('jobModal').style.display = 'block';
}


  function closeModal() {
    document.getElementById('jobModal').style.display = 'none';
  }

  function saveJob(job) {
    let saved = JSON.parse(localStorage.getItem('savedJobs')) || [];
    if (!saved.find(j => j.id === job.id)) {
      saved.push(job);
      localStorage.setItem('savedJobs', JSON.stringify(saved));
      alert('Job saved successfully');
    } else {
      alert('Job already saved');
    }
  }

  loadJobs();
</script>

</body>
</html>
